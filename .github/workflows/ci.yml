name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Code Standards (Ruff)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    - name: Run Ruff Linter
      run: |
        ruff check gomaa/ tests/

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Python 3.9 is not installable on the 26.04 runner image; pin the OS per version.
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-24.04
          - python-version: "3.11"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-24.04
          - python-version: "3.13"
            os: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Unit tests need the package + test tooling, not torch/sentence-transformers.
        # Pulling the full .[dev] extra made 3.9 build heavy wheels from source and hang.
        pip install -e . pytest pytest-cov psycopg2-binary pgvector fastapi uvicorn

    - name: Run unit tests
      run: |
        pytest tests/ -v -m "not integration"

  integration-tests:
    name: PostgreSQL + pgvector Integration Tests
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ci_ephemeral_test_password_2026
          POSTGRES_DB: test_gomaa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run integration tests with live PostgreSQL
      env:
        MEMORY_DB_DSN: "postgresql://test_user:ci_ephemeral_test_password_2026@localhost:5432/test_gomaa"
        MEMORY_TEST_DSN: "postgresql://test_user:ci_ephemeral_test_password_2026@localhost:5432/test_gomaa"
        MEMORY_REQUIRE_POSTGRES: "true"
      run: |
        pytest tests/test_integration.py tests/test_postgres_contract.py tests/test_retrieval_golden.py -v
