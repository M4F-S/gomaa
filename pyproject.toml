[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gomaa"
version = "3.5.0"
description = "Production-grade local hierarchical memory platform for AI agents with Obsidian sync, hybrid RRF search, and Ebbinghaus temporal decay."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Mohamed Fathy", email = "mfathy7@users.noreply.github.com" },
]
keywords = [
    "memory",
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "obsidian",
    "pgvector",
    "gomaa",
    "hermes",
    "openclaw",
    "claude",
    "cursor",
    "knowledge-graph",
    "ebbinghaus-decay",
    "vector-database"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0.1",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
]
fastembed = [
    "fastembed>=0.2.0",
]
local-models = [
    "sentence-transformers>=2.2.2",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]
embed-service = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sentence-transformers>=2.2.2",
]
gdrive = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
]
all = [
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "fastembed>=0.2.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "sentence-transformers>=2.2.2",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
    "fastembed>=0.2.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "sentence-transformers>=2.2.2",
]

[project.scripts]
gomaa = "gomaa.cli:main"
mnemosyne = "gomaa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gomaa", "mnemosyne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: PostgreSQL and live service integration tests",
]
filterwarnings = [
    "ignore:The 'mnemosyne' package has been renamed:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

