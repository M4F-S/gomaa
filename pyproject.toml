[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemosyne-memory"
version = "3.4.0"
description = "Production-grade local hierarchical memory platform for AI agents with Obsidian sync, hybrid RRF search, and Ebbinghaus temporal decay."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Mohamed Fathy", email = "mfathy7@users.noreply.github.com" },
]
keywords = [
    "memory",
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "obsidian",
    "pgvector",
    "hermes",
    "openclaw",
    "claude",
    "cursor",
    "knowledge-graph",
    "ebbinghaus-decay",
    "vector-database"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
    "sentence-transformers>=2.2.2",
    "pyyaml>=6.0.1",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
embed-service = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]
fastembed = [
    "fastembed>=0.2.0",
]
gdrive = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.scripts]
mnemosyne = "mnemosyne.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mnemosyne"]
