services:
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: mnemosyne
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mnemosyne
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemosyne"]
      interval: 5s
      timeout: 5s
      retries: 5

  mnemosyne:
    build: .
    environment:
      MEMORY_DB_DSN: "postgresql://mnemosyne:***@postgres:5432/mnemosyne"
      MEMORY_VAULT_PATH: "/app/data/vault"
      MEMORY_REQUIRE_POSTGRES: "true"
    volumes:
      - ./mnemosyne-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    command: ["python", "-m", "mnemosyne.mcp_server"]

volumes:
  postgres_data:
